name: Apply media studio exact-white and safe-crop fix

on:
  push:
    branches:
      - fix/media-pipeline-codex
    paths:
      - .github/workflows/apply-media-studio-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/media-pipeline-codex
          fetch-depth: 0

      - name: Patch media studio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Patch anchor not found: {label}')
              return text.replace(old, new, 1)

          # 1) Register the exact-white preset at the source of truth so /api/media/presets always returns it.
          p = Path('server/services/media/modelImageGeneratorService.ts')
          text = p.read_text()
          if 'ecommerce_white_product:' not in text:
              anchor = "\n};\n\nexport const STRICT_DESIGN_LOCK_CLAUSE"
              preset = """
  ecommerce_white_product: {
    id: 'ecommerce_white_product',
    name: 'E-Commerce White Product (Exact)',
    category: 'editorial',
    description: 'Second premium 2048px pure-white listing image using exact jewellery pixels; PhotoRoom isolation, no model, no redesign',
    basePrompt:
      'Create a second premium e-commerce product image on a solid pure white #FFFFFF background. Preserve the exact jewellery pixels, design, metal tone, stone colours, stone count, chain, clasp, earrings and proportions. Do not redraw, recolour, reshape, add or remove any product component.',
  },
"""
              text = replace_once(text, anchor, preset + anchor, 'model preset insertion')
              p.write_text(text)

          # 2) Make Slot 3 a safe set-detail crop: preserve complete earrings + pendant instead of cutting through earrings.
          p = Path('server/services/media/deterministicImageService.ts')
          text = p.read_text()
          old = """  if (targetRegion === 'pendant' || targetRegion === 'stones') {
    const focusTop = targetRegion === 'pendant' ? 0.48 : 0.4;
    cropY = Math.round(autoBox.y + autoBox.height * focusTop);
    cropH = Math.max(1, Math.round(autoBox.height * (1 - focusTop)));
    cropX = Math.round(autoBox.x + autoBox.width * 0.12);
    cropW = Math.max(1, Math.round(autoBox.width * 0.76));
  } else if (targetRegion === 'earrings') {
    cropY = Math.round(autoBox.y + autoBox.height * 0.18);
    cropH = Math.max(1, Math.round(autoBox.height * 0.44));
    cropX = Math.round(autoBox.x + autoBox.width * 0.12);
    cropW = Math.max(1, Math.round(autoBox.width * 0.76));
  }
"""
          new = """  if (targetRegion === 'pendant') {
    // Safe set-detail framing for pendant/necklace sets.
    // The previous 48% top cut could literally slice through matching earrings.
    // Keep the complete central sellable cluster (earrings + pendant) and only
    // remove the least useful upper chain/clasp area. Final output still uses
    // contain + white padding, so no component is stretched or force-cropped.
    const focusTop = 0.20;
    const focusBottom = 0.99;
    cropY = Math.round(autoBox.y + autoBox.height * focusTop);
    cropH = Math.max(1, Math.round(autoBox.height * (focusBottom - focusTop)));
    cropX = Math.round(autoBox.x + autoBox.width * 0.05);
    cropW = Math.max(1, Math.round(autoBox.width * 0.90));
  } else if (targetRegion === 'stones') {
    cropY = Math.round(autoBox.y + autoBox.height * 0.34);
    cropH = Math.max(1, Math.round(autoBox.height * 0.62));
    cropX = Math.round(autoBox.x + autoBox.width * 0.09);
    cropW = Math.max(1, Math.round(autoBox.width * 0.82));
  } else if (targetRegion === 'earrings') {
    cropY = Math.round(autoBox.y + autoBox.height * 0.18);
    cropH = Math.max(1, Math.round(autoBox.height * 0.44));
    cropX = Math.round(autoBox.x + autoBox.width * 0.12);
    cropW = Math.max(1, Math.round(autoBox.width * 0.76));
  }
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const focusTop = 0.20;' not in text:
              raise SystemExit('Patch anchor not found: safe Slot 3 crop')
          p.write_text(text)

          # 3) Guarantee the option is visible client-side even if a stale backend preset list is cached.
          p = Path('src/components/MediaPackStudioModal.tsx')
          text = p.read_text()
          old = """      fetchMediaPresets().then((list) => {
        if (list && list.length > 0) {
          setPresets(list);
          if (!selectedPreset) setSelectedPreset(list[0].id);
        }
      });
"""
          new = """      fetchMediaPresets().then((list) => {
        const exactWhitePreset: StylingPreset = {
          id: 'ecommerce_white_product',
          name: 'E-Commerce White Product (Exact)',
          description: 'Second premium pure-white product image using exact jewellery pixels; no model or redesign',
          defaultPrompt: 'Exact product pixels on #FFFFFF using PhotoRoom isolation and non-destructive 2048px framing.',
        };
        const normalizedPresets = Array.isArray(list) ? [...list] : [];
        if (!normalizedPresets.some((p) => p.id === exactWhitePreset.id)) {
          normalizedPresets.push(exactWhitePreset);
        }
        setPresets(normalizedPresets);
        if (!selectedPreset && normalizedPresets.length > 0) setSelectedPreset(normalizedPresets[0].id);
      });
"""
          if old in text:
              text = text.replace(old, new, 1)

          fallback_old = '                          <option value="everyday_wear">Everyday Casual</option>\n'
          fallback_new = fallback_old + '                          <option value="ecommerce_white_product">E-Commerce White Product (Exact)</option>\n'
          if 'value="ecommerce_white_product"' not in text and fallback_old in text:
              text = text.replace(fallback_old, fallback_new, 1)

          # Extend the add-slot generator with an exact-white deterministic mode.
          text = text.replace(
              "targetType: 'AI_MODEL' | 'STYLED_SUPPORTING',",
              "targetType: 'AI_MODEL' | 'STYLED_SUPPORTING' | 'ECOMMERCE_WHITE_EXACT',",
              1,
          )

          old = """    const newSlotNumber = galleryPack.slots.length + 1;
    setRegeneratingSlot(newSlotNumber);

    // Add placeholder slot
    const placeholderSlot: import('../types/media').GallerySlot = {
      slotNumber: newSlotNumber,
      slotRole: targetType === 'AI_MODEL' ? 'AI_MODEL_LIFESTYLE_1' : 'STYLED_SUPPORTING',
      slotTitle: targetType === 'AI_MODEL' ? 'Fashion Model (Generating...)' : 'Styled Supporting (Generating...)',
      mediaAssetId: `new_gen_${Date.now()}`,
      url: source.base64,
      sourceType: targetType === 'AI_MODEL' ? 'ai_model' : 'ai_lifestyle',
      altText: `${product?.title || 'Jewelry piece'} ${targetType === 'AI_MODEL' ? 'model' : 'styled'}`,
      seoKeywords: [],
      dimensions: { width: 2048, height: 2048 },
      isCover: false,
      isAiGenerated: true,
      canRegenerate: true,
      included: true,
    };
"""
          new = """    const newSlotNumber = galleryPack.slots.length + 1;
    setRegeneratingSlot(newSlotNumber);
    const isExactWhite = targetType === 'ECOMMERCE_WHITE_EXACT';
    const isModel = targetType === 'AI_MODEL';
    const effectivePreset = isExactWhite ? 'ecommerce_white_product' : selectedPreset;

    // Add placeholder slot. Exact-white is a deterministic PhotoRoom/Sharp derivative,
    // not an AI-redrawn product, so keep it clearly labelled as such.
    const placeholderSlot: import('../types/media').GallerySlot = {
      slotNumber: newSlotNumber,
      slotRole: isExactWhite ? 'ALT_ANGLE' : (isModel ? 'AI_MODEL_LIFESTYLE_1' : 'STYLED_SUPPORTING'),
      slotTitle: isExactWhite
        ? 'E-Commerce White Product (Generating...)'
        : (isModel ? 'Fashion Model (Generating...)' : 'Styled Supporting (Generating...)'),
      mediaAssetId: `new_gen_${Date.now()}`,
      url: source.base64,
      sourceType: isExactWhite ? 'DERIVATIVE' : (isModel ? 'ai_model' : 'ai_lifestyle'),
      altText: isExactWhite
        ? `${product?.title || 'Jewelry piece'} exact white background product view`
        : `${product?.title || 'Jewelry piece'} ${isModel ? 'model' : 'styled'}`,
      seoKeywords: isExactWhite ? ['jewelry', 'white background', 'ecommerce'] : [],
      dimensions: { width: 2048, height: 2048 },
      isCover: false,
      isAiGenerated: !isExactWhite,
      canRegenerate: true,
      included: true,
      modelPresetKey: isExactWhite ? 'ecommerce_white_product' : undefined,
    };
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "const isExactWhite = targetType === 'ECOMMERCE_WHITE_EXACT';" not in text:
              raise SystemExit('Patch anchor not found: add-slot exact-white setup')

          text = text.replace(
              '        stylingPreset: selectedPreset,\n',
              '        stylingPreset: effectivePreset,\n',
              1,
          )
          text = text.replace(
              '        targetRole: targetType,\n',
              "        targetRole: targetType === 'STYLED_SUPPORTING' ? 'STYLED_SUPPORTING' : 'AI_MODEL',\n",
              1,
          )

          # Add a one-click Exact White button beside Model Shot and Styled Shot on every real photo card.
          styled_button_end = """                              <Sparkles size={11} />
                              <span>+ Styled Shot</span>
                            </button>
"""
          exact_button = styled_button_end + """                            <button
                              type=\"button\"
                              onClick={() => generateNewSlotFromPhoto('ECOMMERCE_WHITE_EXACT', { base64: displayImgUrl, title: slot.slotTitle || 'Real Photo', slotNumber: slot.slotNumber })}
                              style={{
                                flex: 1,
                                padding: '5px 6px',
                                borderRadius: '6px',
                                backgroundColor: 'rgba(255, 255, 255, 0.08)',
                                border: '1px solid rgba(255, 255, 255, 0.18)',
                                color: '#f8fafc',
                                fontSize: '0.62rem',
                                fontWeight: 700,
                                cursor: 'pointer',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                gap: '3px',
                              }}
                              title=\"Create a second exact-product 2048px pure-white e-commerce image with PhotoRoom. No redesign or recolouring.\"
                            >
                              <ShieldCheck size={11} />
                              <span>+ Exact White</span>
                            </button>
"""
          if '+ Exact White' not in text:
              text = replace_once(text, styled_button_end, exact_button, 'exact-white quick action button')

          # Exact-white derivative must not be treated as an AI hallucination slot in card/lightbox controls.
          old_ai = """                  const isAiSlot =
                    slot.isAiGenerated ||
                    slot.sourceType === 'ai_model' ||
                    slot.sourceType === 'ai_lifestyle' ||
                    slot.sourceType === 'AI_MODEL' ||
                    slot.slotRole === 'STYLED_SUPPORTING' ||
                    (slot.slotRole as string) === 'MODEL_1' ||
                    (slot.slotRole as string) === 'MODEL_2_OR_SUPPORTING' ||
                    slot.slotRole === 'AI_MODEL_LIFESTYLE_1' ||
                    slot.slotRole === 'AI_MODEL_LIFESTYLE_2';
"""
          new_ai = """                  const isExactWhiteSlot = slot.modelPresetKey === 'ecommerce_white_product';
                  const isAiSlot =
                    !isExactWhiteSlot && (
                      slot.isAiGenerated ||
                      slot.sourceType === 'ai_model' ||
                      slot.sourceType === 'ai_lifestyle' ||
                      slot.sourceType === 'AI_MODEL' ||
                      slot.slotRole === 'STYLED_SUPPORTING' ||
                      (slot.slotRole as string) === 'MODEL_1' ||
                      (slot.slotRole as string) === 'MODEL_2_OR_SUPPORTING' ||
                      slot.slotRole === 'AI_MODEL_LIFESTYLE_1' ||
                      slot.slotRole === 'AI_MODEL_LIFESTYLE_2'
                    );
"""
          if old_ai in text:
              text = text.replace(old_ai, new_ai, 1)

          old_ai_lightbox = """        const isAiSlot =
          slot.isAiGenerated ||
          slot.sourceType === 'ai_model' ||
          slot.sourceType === 'ai_lifestyle' ||
          slot.sourceType === 'AI_MODEL' ||
          slot.slotRole === 'STYLED_SUPPORTING' ||
          (slot.slotRole as string) === 'MODEL_1' ||
          (slot.slotRole as string) === 'MODEL_2_OR_SUPPORTING' ||
          slot.slotRole === 'AI_MODEL_LIFESTYLE_1' ||
          slot.slotRole === 'AI_MODEL_LIFESTYLE_2';
"""
          new_ai_lightbox = """        const isExactWhiteSlot = slot.modelPresetKey === 'ecommerce_white_product';
        const isAiSlot =
          !isExactWhiteSlot && (
            slot.isAiGenerated ||
            slot.sourceType === 'ai_model' ||
            slot.sourceType === 'ai_lifestyle' ||
            slot.sourceType === 'AI_MODEL' ||
            slot.slotRole === 'STYLED_SUPPORTING' ||
            (slot.slotRole as string) === 'MODEL_1' ||
            (slot.slotRole as string) === 'MODEL_2_OR_SUPPORTING' ||
            slot.slotRole === 'AI_MODEL_LIFESTYLE_1' ||
            slot.slotRole === 'AI_MODEL_LIFESTYLE_2'
          );
"""
          if old_ai_lightbox in text:
              text = text.replace(old_ai_lightbox, new_ai_lightbox, 1)

          # Make Slot 4 wording honest when the exact-white preset is selected there.
          text = text.replace(
              "                          Slot 4: AI Fashion Model Image\n",
              "                          {selectedPreset === 'ecommerce_white_product' ? 'Slot 4: E-Commerce White Product (Exact)' : 'Slot 4: AI Fashion Model Image'}\n",
              1,
          )
          text = text.replace(
              "                        {enableModelSlot4 ? '✓ Will be generated with AI' : 'Off (Uses authentic real photo)'}\n",
              "                        {enableModelSlot4 ? (selectedPreset === 'ecommerce_white_product' ? '✓ Exact product pixels on pure white — no redesign' : '✓ Will be generated with AI') : 'Off (Uses authentic real photo)'}\n",
              1,
          )

          p.write_text(text)

          # 4) Backend regeneration: correctly resolve URL sources and label exact-white output as a derivative.
          p = Path('server/services/media/galleryPackService.ts')
          text = p.read_text()

          old_source = """  if (options.sourceBase64) {
    const raw = options.sourceBase64.replace(/^data:image\\/\\w+;base64,/, '');
    try {
      refBuffer = Buffer.from(raw, 'base64');
      refUrl = options.sourceImageUrl || `data:image/jpeg;base64,${raw}`;
    } catch {}
  } else if (options.sourceSlotNumber) {
"""
          new_source = """  if (options.sourceBase64?.startsWith('data:image/')) {
    const raw = options.sourceBase64.replace(/^data:image\\/[^;]+;base64,/, '');
    try {
      refBuffer = Buffer.from(raw, 'base64');
      refUrl = options.sourceImageUrl || options.sourceBase64;
    } catch {}
  } else if (options.sourceSlotNumber) {
"""
          if old_source in text:
              text = text.replace(old_source, new_source, 1)

          old_url_tail = """  } else if (options.sourceImageUrl) {
    refUrl = options.sourceImageUrl;
    refBuffer = getItemBuffer({ imageUrl: options.sourceImageUrl });
  }
"""
          new_url_tail = """  } else if (options.sourceImageUrl || options.sourceBase64) {
    // sourceBase64 is sometimes a local /api/photos/... URL from the UI quick-action.
    // Never decode a URL string as base64; resolve the actual authentic image instead.
    refUrl = options.sourceImageUrl || options.sourceBase64 || '';
    refBuffer = getItemBuffer({ imageUrl: refUrl, url: refUrl });
  }
"""
          if old_url_tail in text:
              text = text.replace(old_url_tail, new_url_tail, 1)

          # Initial Slot 4 build path.
          marker = "      const presetKey = params.modelPresetKey || 'office_to_occasion';\n"
          if "const isExactWhiteProduct = presetKey === 'ecommerce_white_product';" not in text:
              text = replace_once(
                  text,
                  marker,
                  marker + "      const isExactWhiteProduct = presetKey === 'ecommerce_white_product';\n",
                  'initial exact-white mode flag',
              )

          # Limit replacements to the Slot 4 section so Slot 2/5 semantics are untouched.
          start = text.index('  // SLOT 4 — actual model generation only.')
          end = text.index('  // SLOT 5 — component focus by default', start)
          section = text[start:end]
          section = section.replace(
              "          slotTitle: `Fashion Model (${MODEL_STYLING_PRESETS[presetKey]?.name || 'Editorial'})`,",
              "          slotTitle: isExactWhiteProduct ? 'E-Commerce White Product (Exact)' : `Fashion Model (${MODEL_STYLING_PRESETS[presetKey]?.name || 'Editorial'})`,",
              1,
          )
          section = section.replace(
              "          sourceType: 'ai_model',",
              "          sourceType: isExactWhiteProduct ? 'DERIVATIVE' : 'ai_model',",
              1,
          )
          section = section.replace(
              "          altText: generateSlotAltText(params.productTitle, 'MODEL_1'),",
              "          altText: isExactWhiteProduct ? `Pure white e-commerce product view of ${params.productTitle}` : generateSlotAltText(params.productTitle, 'MODEL_1'),",
              1,
          )
          section = section.replace(
              "          qualityScore: modelGen.consistencyScore ?? 0,",
              "          qualityScore: isExactWhiteProduct ? 100 : (modelGen.consistencyScore ?? 0),",
              1,
          )
          section = section.replace(
              "          isAiGenerated: true,",
              "          isAiGenerated: !isExactWhiteProduct,",
              1,
          )
          text = text[:start] + section + text[end:]

          # Regeneration/additional-slot path.
          regen_marker = "    const presetKey = options.newPresetKey || targetSlot.modelPresetKey || 'office_to_occasion';\n"
          if "const isExactWhiteProduct = presetKey === 'ecommerce_white_product';" not in text[text.index('/** Regenerates one slot'):]:
              text = replace_once(
                  text,
                  regen_marker,
                  regen_marker + "    const isExactWhiteProduct = presetKey === 'ecommerce_white_product';\n",
                  'regeneration exact-white mode flag',
              )

          regen_start = text.index("  if (slotNumber === 4 || options.targetRole === 'AI_MODEL')")
          regen_section = text[regen_start:]
          regen_section = regen_section.replace(
              "        slotRole: 'MODEL_1',",
              "        slotRole: isExactWhiteProduct ? 'ALT_VIEW' : 'MODEL_1',",
              1,
          )
          regen_section = regen_section.replace(
              "        slotTitle: `Fashion Model (${MODEL_STYLING_PRESETS[presetKey]?.name || 'Editorial'})`,",
              "        slotTitle: isExactWhiteProduct ? 'E-Commerce White Product (Exact)' : `Fashion Model (${MODEL_STYLING_PRESETS[presetKey]?.name || 'Editorial'})`,",
              1,
          )
          regen_section = regen_section.replace(
              "        altText: `Fashion model wearing ${currentPack.productTitle}`,",
              "        altText: isExactWhiteProduct ? `Pure white e-commerce product view of ${currentPack.productTitle}` : `Fashion model wearing ${currentPack.productTitle}`,",
              1,
          )
          regen_section = regen_section.replace(
              "        sourceType: 'ai_model',",
              "        sourceType: isExactWhiteProduct ? 'DERIVATIVE' : 'ai_model',",
              1,
          )
          regen_section = regen_section.replace(
              "        qualityScore: modelGen.consistencyScore ?? 0,",
              "        qualityScore: isExactWhiteProduct ? 100 : (modelGen.consistencyScore ?? 0),",
              1,
          )
          regen_section = regen_section.replace(
              "        isAiGenerated: true,",
              "        isAiGenerated: !isExactWhiteProduct,",
              1,
          )
          text = text[:regen_start] + regen_section

          # Make Slot 3 label reflect the new safe crop behavior.
          text = text.replace(
              "          slotTitle: 'Detail / Craftsmanship Close-up',",
              "          slotTitle: 'Product Detail — Pendant + Earrings (Safe Crop)',",
              1,
          )

          p.write_text(text)

          print('Media studio patch applied successfully.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and production build
        run: npm run build

      - name: Commit applied fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/media/modelImageGeneratorService.ts server/services/media/deterministicImageService.ts server/services/media/galleryPackService.ts src/components/MediaPackStudioModal.tsx
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Fix exact white ecommerce option and safe product detail crop"
          git push origin HEAD:fix/media-pipeline-codex
