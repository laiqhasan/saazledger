name: Apply Media Studio Fix

"on":
  push:
    branches:
      - fix/media-pipeline-codex
    paths:
      - .github/workflows/apply-media-studio-fix.yml
      - .github/scripts/apply_media_studio_fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/media-pipeline-codex
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/scripts/apply_media_studio_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/media/modelImageGeneratorService.ts server/services/media/deterministicImageService.ts server/services/media/galleryPackService.ts src/components/MediaPackStudioModal.tsx
          if git diff --cached --quiet; then
            echo "No source changes required"
          else
            git commit -m "Fix exact white ecommerce option and safe product detail crop"
            git push origin HEAD:fix/media-pipeline-codex
          fi
